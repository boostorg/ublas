name: "Clang Code Format"

on: 
  push:
    paths-ignore: 
      - '**.md'
      - 'doc/**'
  pull_request:
    paths-ignore: 
      - '**.md'
      - 'doc/**'
jobs:
  format:
    name: "Clang Code Formatting Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install Clang Format
        run: |
          sudo apt-get install -y clang-format

#      - name: "Format Codes"
